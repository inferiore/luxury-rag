services:
  app:
    # La imagen se construye y publica en GitHub Actions (ghcr.io) — el
    # deploy en el servidor hace `docker compose pull` y usa esa imagen ya
    # compilada, no reconstruye localmente. El bloque `build:` se conserva
    # como fallback para `docker compose up -d --build` en local/dev o si
    # ghcr.io no está disponible.
    image: ghcr.io/inferiore/luxury-rag:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_API_KEY: ${VITE_API_KEY}
    container_name: rag-app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      # Producción se conecta a un proyecto Supabase Postgres administrado
      # (conexión directa, sin pooler) en vez de un contenedor local — no
      # hay servicio "postgres" en este compose. Estos 6 valores deben venir
      # de un .env real apuntando a las credenciales de Supabase; no hay
      # defaults sensatos que puedan sustituir a un self-hosted local aquí.
      # Ver .env.example para el detalle de cada valor.
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SSL: ${POSTGRES_SSL:-true}
      # BASE_URL ya NO se hardcodea a host.docker.internal — ahora sirve
      # tanto para Ollama local como para un proveedor cloud, y se lee de
      # .env como todo lo demás. Si LLM_PROVIDER=ollama y este contenedor
      # corre en Docker, .env DEBE tener BASE_URL=http://host.docker.internal:11434
      # explícito, o el contenedor intentará conectarse a sí mismo
      # (localhost) y fallará con "Ollama no responde". Ver .env.example.
      BASE_URL: ${BASE_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:8b}
      VECTOR_DIM: ${VECTOR_DIM:-1536}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEFAULT_TOP_K: ${DEFAULT_TOP_K:-5}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.4}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    extra_hosts:
      # host-gateway makes host.docker.internal resolve on Linux Docker
      # Engine too; no-op / already default on Docker Desktop for Mac.
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: rag-nginx
    restart: unless-stopped
    # Gateado con un profile a propósito: `docker compose -f docker-compose.yml
    # -f docker-compose.dev.yml up` (dev local) trae TODOS los servicios de
    # docker-compose.yml por default, no solo los que docker-compose.dev.yml
    # sobreescribe explícitamente — sin este profile, dev también intentaría
    # levantar nginx (crashea: no existen los certificados SSL de
    # rag.luxuryhorizon.lat en local) y un certbot inútil. En el VPS de
    # producción, .env real debe tener `COMPOSE_PROFILES=production` (ver
    # .env.example) para que el `docker compose up -d --build` documentado en
    # el README/CI siga funcionando sin flags extra.
    profiles: ["production"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    depends_on:
      app:
        condition: service_healthy

  certbot:
    image: certbot/certbot
    profiles: ["production"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
