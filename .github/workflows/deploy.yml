name: Deploy a producción

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/inferiore/luxury-rag:latest
          # VITE_API_BASE_URL siempre vacío en producción: frontend y
          # backend comparten origen detrás de nginx, así que las rutas
          # relativas funcionan solas (ver README, sección Producción).
          build-args: |
            VITE_API_BASE_URL=
            VITE_API_KEY=${{ secrets.VITE_API_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RAG_SSH_HOST }}
          username: ${{ secrets.RAG_SSH_USER }}
          key: ${{ secrets.RAG_DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.RAG_DEPLOY_PATH }} && git pull && docker compose pull && docker compose up -d
