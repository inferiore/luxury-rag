name: Deploy a producción

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.RAG_SSH_HOST }}
          username: ${{ secrets.RAG_SSH_USER }}
          key: ${{ secrets.RAG_DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.RAG_DEPLOY_PATH }} && git pull && docker compose up -d --build
